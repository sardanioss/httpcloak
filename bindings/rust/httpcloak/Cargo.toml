[package]
name = "httpcloak"
description = "HTTP client whose TLS, HTTP/2 and HTTP/3 fingerprints match a real browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["http", "tls", "fingerprint", "http3", "browser"]
categories = ["web-programming::http-client", "network-programming", "api-bindings"]

[features]
default = ["charset"]
# Decode Response::text with the charset the Content-Type names, not only UTF-8.
charset = ["dep:encoding_rs"]

[dependencies]
httpcloak-sys = { version = "=1.7.3", path = "../httpcloak-sys" }
base64 = "0.22"
encoding_rs = { version = "0.8", optional = true }
form_urlencoded = "1.2"
futures-core = "0.3"
http = "1"
httpdate = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bytes = "1"
futures-util = "0.3"
proptest = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
