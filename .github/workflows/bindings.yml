name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: "Publish the NuGet package from this ref (for a tag whose NuGet push failed)"
        type: boolean
        default: false

jobs:
  # Every package must say the same version, and on a tag, the tag's. A tag
  # pushed before bump-version.sh ran would otherwise upload new libraries into
  # the previous, live release. Everything else waits on this.
  check-version:
    name: Package versions match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions
        run: python3 bindings/check_version.py "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

  build-native:
    name: Build native library (${{ matrix.os }}-${{ matrix.arch }})
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            lib_ext: .so
            manylinux: quay.io/pypa/manylinux2014_x86_64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            lib_ext: .so
            manylinux: quay.io/pypa/manylinux2014_aarch64
          - os: darwin
            arch: arm64
            runner: macos-15
            lib_ext: .dylib
          - os: windows
            arch: amd64
            runner: windows-latest
            lib_ext: .dll

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bindings/clib/go.mod

      - name: Remove local replace directives and tidy for CI
        shell: bash
        run: |
          cd bindings/clib
          go mod edit -dropreplace=github.com/sardanioss/utls
          go mod edit -dropreplace=github.com/sardanioss/net
          go mod edit -dropreplace=github.com/sardanioss/quic-go
          go mod edit -dropreplace=github.com/sardanioss/udpbara
          GONOSUMCHECK='github.com/sardanioss/*' GONOSUMDB='github.com/sardanioss/*' GOFLAGS=-mod=mod go mod tidy

      # Linux builds inside manylinux2014 (glibc 2.17), so the library needs no
      # newer glibc than the wheels promise. Built on the runner it needed the
      # runner's glibc 2.34 and failed to load on older distributions.
      - name: Build native library (Linux, manylinux2014)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$(go env GOROOT):/goroot:ro" -v "$(go env GOMODCACHE):/gomodcache" \
            -v "$GITHUB_WORKSPACE:/src" -w /src/bindings/clib \
            -e GOROOT=/goroot -e GOMODCACHE=/gomodcache -e GOCACHE=/tmp/gocache \
            -e GOTOOLCHAIN=local -e GOFLAGS=-mod=mod -e CGO_ENABLED=1 \
            -e GONOSUMDB='github.com/sardanioss/*' \
            ${{ matrix.manylinux }} \
            bash -c 'export PATH=/goroot/bin:$PATH && ldd --version | head -1 && ./build.sh native'

      - name: Build native library (macOS)
        if: runner.os == 'macOS'
        run: |
          cd bindings/clib
          chmod +x build.sh
          ./build.sh native
        env:
          CGO_ENABLED: 1

      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd bindings/clib
          mkdir -p dist
          go run ./exportgen -check
          CGO_ENABLED=1 go build -buildmode=c-shared -ldflags="-s -w" -o dist/libhttpcloak-windows-amd64.dll .

      # Nothing is uploaded until the library has passed: no dependency a stock
      # machine lacks, no glibc or macOS newer than the packages promise, the
      # exports the bindings call, and a real load that creates a session. On
      # Windows the load runs with PATH cut down to the system directories, so
      # the runner's MinGW cannot hide a missing DLL (#131). On Linux it runs
      # in manylinux2014, at the oldest glibc the wheels claim.
      - name: Verify native library (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 bindings/clib/verify_native.py --os linux \
            bindings/clib/dist/libhttpcloak-linux-${{ matrix.arch }}.so
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src ${{ matrix.manylinux }} \
            /opt/python/cp311-cp311/bin/python bindings/clib/verify_native.py --os linux --load \
            bindings/clib/dist/libhttpcloak-linux-${{ matrix.arch }}.so

      - name: Verify native library (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 bindings/clib/verify_native.py --os darwin --load \
            bindings/clib/dist/libhttpcloak-darwin-${{ matrix.arch }}.dylib

      - name: Verify native library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python bindings/clib/verify_native.py --os windows --load \
            bindings/clib/dist/libhttpcloak-windows-amd64.dll

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.os }}-${{ matrix.arch }}
          path: bindings/clib/dist/libhttpcloak-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.lib_ext }}

  # Build darwin-amd64 from ARM runner (cross-compile)
  build-darwin-amd64:
    name: Build native library (darwin-amd64)
    needs: check-version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bindings/clib/go.mod

      - name: Remove local replace directives and tidy for CI
        run: |
          cd bindings/clib
          go mod edit -dropreplace=github.com/sardanioss/utls
          go mod edit -dropreplace=github.com/sardanioss/net
          go mod edit -dropreplace=github.com/sardanioss/quic-go
          go mod edit -dropreplace=github.com/sardanioss/udpbara
          GONOSUMCHECK='github.com/sardanioss/*' GONOSUMDB='github.com/sardanioss/*' GOFLAGS=-mod=mod go mod tidy

      - name: Build for darwin/amd64
        run: |
          cd bindings/clib
          mkdir -p dist
          go run ./exportgen -check
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -buildmode=c-shared -ldflags="-s -w" -o dist/libhttpcloak-darwin-amd64.dylib .
        env:
          CGO_ENABLED: 1

      # The x86_64 library is loaded under Rosetta, through the universal
      # /usr/bin/python3, so it gets the same real-load check as the others.
      - name: Verify native library
        run: |
          arch -x86_64 /usr/bin/python3 bindings/clib/verify_native.py --os darwin --load \
            bindings/clib/dist/libhttpcloak-darwin-amd64.dylib

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: lib-darwin-amd64
          path: bindings/clib/dist/libhttpcloak-darwin-amd64.dylib

  build-android:
    name: Build Android library
    needs: check-version
    runs-on: ubuntu-latest
    # Runs the Gradle wrapper, so it gets a read-only token and none left in
    # the checkout's git config.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bindings/clib/go.mod

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Remove local replace directives and tidy for CI
        run: |
          cd bindings/clib
          go mod edit -dropreplace=github.com/sardanioss/utls
          go mod edit -dropreplace=github.com/sardanioss/net
          go mod edit -dropreplace=github.com/sardanioss/quic-go
          go mod edit -dropreplace=github.com/sardanioss/udpbara
          GONOSUMCHECK='github.com/sardanioss/*' GONOSUMDB='github.com/sardanioss/*' GOFLAGS=-mod=mod go mod tidy

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Build AAR
        run: |
          cd bindings/android
          ./gradlew --no-daemon :httpcloak:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: android-aar
          path: bindings/android/httpcloak/build/outputs/aar/httpcloak-release.aar

  build-python-wheels:
    name: Build Python wheel (${{ matrix.os }}-${{ matrix.arch }})
    needs: [build-native, build-darwin-amd64]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            plat_tag: manylinux_2_17_x86_64
          - os: linux
            arch: arm64
            plat_tag: manylinux_2_17_aarch64
          - os: darwin
            arch: amd64
            plat_tag: macosx_12_0_x86_64
          - os: darwin
            arch: arm64
            plat_tag: macosx_12_0_arm64
          - os: windows
            arch: amd64
            plat_tag: win_amd64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: lib-${{ matrix.os }}-${{ matrix.arch }}
          path: bindings/python/httpcloak/lib/

      - name: Build wheel
        run: |
          cd bindings/python
          pip install build wheel
          python -m build --wheel

      - name: Rename wheel with platform tag
        run: |
          cd bindings/python/dist
          for f in *.whl; do
            newname=$(echo "$f" | sed 's/-py3-none-any/-py3-none-${{ matrix.plat_tag }}/')
            mv "$f" "$newname"
          done

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: bindings/python/dist/*.whl

  build-npm-platform-packages:
    name: Build npm platform package (${{ matrix.npm_platform }})
    needs: [build-native, build-darwin-amd64]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            npm_platform: linux-x64
          - os: linux
            arch: arm64
            npm_platform: linux-arm64
          - os: darwin
            arch: amd64
            npm_platform: darwin-x64
          - os: darwin
            arch: arm64
            npm_platform: darwin-arm64
          - os: windows
            arch: amd64
            npm_platform: win32-x64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: lib-${{ matrix.os }}-${{ matrix.arch }}
          path: bindings/nodejs/npm/${{ matrix.npm_platform }}/

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: npm-platform-${{ matrix.npm_platform }}
          path: bindings/nodejs/npm/${{ matrix.npm_platform }}/

  # The release gate. Every publish job needs this, so a package whose native
  # library would not load where the package says it does is never uploaded.
  # It checks the finished wheels, npm packages and NuGet package rather than
  # the build output, so a packaging step that picked up the wrong file, or
  # none, fails here as well.
  verify-packages:
    name: Verify packaged native libraries
    needs: [build-python-wheels, build-npm-platform-packages, build-nuget]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: verify/wheels/
          merge-multiple: true

      - name: Download npm platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: npm-platform-*
          path: verify/npm/

      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: verify/nuget/

      - name: Check every packaged library
        run: |
          # download-artifact names each npm folder after its artifact.
          for d in verify/npm/npm-platform-*; do mv "$d" "verify/npm/${d#verify/npm/npm-platform-}"; done
          python3 bindings/clib/verify_packages.py --wheels verify/wheels --npm verify/npm --nuget verify/nuget

  # Install each wheel on its own OS and use it, the way a user's first call
  # does. Windows runs with PATH limited to the system directories, and Linux
  # in manylinux2014, at the oldest glibc the wheel claims.
  smoke-test-wheels:
    name: Smoke-test wheel (${{ matrix.wheel }})
    needs: build-python-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wheel: manylinux_2_17_x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux2014_x86_64
          - wheel: manylinux_2_17_aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux2014_aarch64
          - wheel: macosx_12_0_arm64
            runner: macos-15
            pyarch: arm64
          # The Intel wheel, on an Intel runner.
          - wheel: macosx_12_0_x86_64
            runner: macos-15-intel
            pyarch: x64
          - wheel: win_amd64
            runner: windows-latest
            pyarch: x64
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels/
          merge-multiple: true

      - name: Install and use the wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/wheels:/wheels" ${{ matrix.image }} bash -c '
            set -e
            py=/opt/python/cp39-cp39/bin/python
            $py -m pip install --no-index /wheels/*-${{ matrix.wheel }}.whl
            $py -c "import httpcloak; s = httpcloak.Session(); s.close(); print(\"httpcloak\", httpcloak.version(), \"loaded\")"'

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.pyarch }}

      - name: Install and use the wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          python -c "import platform; print('python is', platform.machine())"
          python -m pip install --no-index wheels/*-${{ matrix.wheel }}.whl
          python -c "import httpcloak; s = httpcloak.Session(); s.close(); print('httpcloak', httpcloak.version(), 'loaded')"

      - name: Install and use the wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $whl = Get-ChildItem wheels\*-${{ matrix.wheel }}.whl
          python -m pip install --no-index $whl.FullName
          $py = (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $py -c "import httpcloak; s = httpcloak.Session(); s.close(); print('httpcloak', httpcloak.version(), 'loaded')"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  publish-pypi:
    name: Publish to PyPI
    needs: [build-python-wheels, verify-packages, smoke-test-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A re-run after a partial publish skips the files already up,
          # as NuGet's --skip-duplicate does.
          skip-existing: true

  publish-npm-platforms:
    name: Publish npm platform packages
    needs: [build-npm-platform-packages, verify-packages, smoke-test-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: npm
    strategy:
      fail-fast: false
      matrix:
        npm_platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download platform package
        uses: actions/download-artifact@v4
        with:
          name: npm-platform-${{ matrix.npm_platform }}
          path: bindings/nodejs/npm/${{ matrix.npm_platform }}/

      - name: Publish platform package
        run: |
          cd bindings/nodejs/npm/${{ matrix.npm_platform }}
          # npm has no notion of a prerelease version: `npm publish` claims the
          # `latest` dist-tag whatever the version says, so a beta would land on
          # every `npm install httpcloak`. PyPI and NuGet skip prereleases on
          # their own; npm has to be told.
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) NPM_TAG=beta ;;
            *)   NPM_TAG=latest ;;
          esac
          echo "publishing $VERSION with dist-tag $NPM_TAG"
          npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-main:
    name: Publish main npm package
    needs: publish-npm-platforms
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish main package
        run: |
          cd bindings/nodejs
          # See the platform-package step: a prerelease must not take `latest`.
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) NPM_TAG=beta ;;
            *)   NPM_TAG=latest ;;
          esac
          echo "publishing $VERSION with dist-tag $NPM_TAG"
          npm publish --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-nuget:
    name: Build NuGet package
    needs: [build-native, build-darwin-amd64]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download linux-amd64 library
        uses: actions/download-artifact@v4
        with:
          name: lib-linux-amd64
          path: bindings/dotnet/HttpCloak/runtimes/linux-x64/native/

      - name: Download linux-arm64 library
        uses: actions/download-artifact@v4
        with:
          name: lib-linux-arm64
          path: bindings/dotnet/HttpCloak/runtimes/linux-arm64/native/

      - name: Download darwin-amd64 library
        uses: actions/download-artifact@v4
        with:
          name: lib-darwin-amd64
          path: bindings/dotnet/HttpCloak/runtimes/osx-x64/native/

      - name: Download darwin-arm64 library
        uses: actions/download-artifact@v4
        with:
          name: lib-darwin-arm64
          path: bindings/dotnet/HttpCloak/runtimes/osx-arm64/native/

      - name: Download windows-amd64 library
        uses: actions/download-artifact@v4
        with:
          name: lib-windows-amd64
          path: bindings/dotnet/HttpCloak/runtimes/win-x64/native/

      - name: Build NuGet package
        run: |
          cd bindings/dotnet/HttpCloak
          dotnet pack -c Release -o ../nupkg

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: bindings/dotnet/nupkg/*.nupkg

  publish-nuget:
    name: Publish to NuGet
    needs: [build-nuget, verify-packages, smoke-test-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_nuget
    environment: nuget
    # Trusted publishing: NuGet/login trades this job's OIDC token for a
    # short-lived API key, so no long-lived key is stored in the repo.
    permissions:
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nupkg/

      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: sardanioss

      - name: Publish to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
